            - generic [ref=e475]:
              - generic [ref=e476]:
                - heading [level=3] [ref=e477]:
                  - button "Wat is het verschil tussen valet en shuttle parkeren?" [expanded] [ref=e478]
                - region "Wat is het verschil tussen valet en shuttle parkeren?" [ref=e484]:
                  - paragraph [ref=e486]: Bij valet parkeren rijdt u rechtstreeks naar de vertrekhal en parkeert onze chauffeur uw auto. Bij shuttle parkeren parkeert u uw eigen auto op onze locatie en brengt onze shuttlebus u binnen 5 tot 8 minuten naar de vertrekhal.
              - generic [ref=e487]:
                - heading [level=3] [ref=e488]:
                  - button "Hoe veilig is mijn auto geparkeerd?" [ref=e489]
                - region "Hoe veilig is mijn auto geparkeerd?":
                  - paragraph [ref=e493]: Uw auto staat geparkeerd op een professioneel parkeerterrein dat 24 uur per dag wordt bewaakt en gemonitord. Alle ritten worden digitaal geregistreerd, zodat er altijd inzicht is in de verplaatsingen van uw voertuig. Zo kunt u met een gerust gevoel op reis, terwijl uw auto veilig achterblijft.
              - generic [ref=e494]:
                - heading [level=3] [ref=e495]:
                  - button "Kan ik mijn reservering annuleren?" [ref=e496]
                - region "Kan ik mijn reservering annuleren?":
                  - paragraph [ref=e500]: Ja, met een annuleringsdekking annuleert u uw reservering tot 24 uur voor aankomst. De annuleringsdekking is een optionele, betaalde toevoeging die u tijdens het reserveren aan uw boeking toevoegt; de prijs ziet u voordat u afrekent. Binnen 24 uur voor uw reis is annuleren niet meer mogelijk. Daarvoor dient u uw eigen reisverzekering in te schakelen.
              - generic [ref=e501]:
                - heading [level=3] [ref=e502]:
                  - button "Hoe ver van tevoren moet ik een reservering maken?" [ref=e503]
                - region "Hoe ver van tevoren moet ik een reservering maken?":
                  - paragraph [ref=e507]: Wij adviseren om uw parkeerplaats zo vroeg mogelijk te reserveren voor de beste beschikbaarheid en tarieven. Lastminute reserveringen zijn vaak ook mogelijk, mits er nog plaatsen beschikbaar zijn. Houd er rekening mee dat voor reserveringen op korte termijn extra kosten in rekening kunnen worden gebracht.
              - generic [ref=e508]:
                - heading [level=3] [ref=e509]:
                  - button "Worden mijn autosleutels veilig opgeborgen?" [ref=e510]
                - region "Worden mijn autosleutels veilig opgeborgen?":
                  - paragraph [ref=e514]: Ja, uw autosleutels worden met de grootste zorg behandeld. Bij onze shuttle service kunt u ervoor kiezen om uw autosleutels zelf mee op reis te nemen. Maakt u gebruik van valet parking, dan worden uw sleutels veilig opgeborgen in een brandwerende kluis op ons kantoor, dat is voorzien van camerabewaking.
              - generic [ref=e515]:
                - heading [level=3] [ref=e516]:
                  - button "Wat gebeurt er als mijn vlucht vertraagd is?" [ref=e517]
                - region "Wat gebeurt er als mijn vlucht vertraagd is?":
                  - paragraph [ref=e521]: Geen zorgen. Wij volgen de actuele vluchtinformatie en passen de ophaaltijd indien nodig aan. Bij een vertraging of vervroegde landing zorgen wij ervoor dat uw auto weer op het afgesproken moment beschikbaar is. Vergeet niet direct te bellen na uw landing op Schiphol.
